version: "2"

linters:
  default: all
  disable:
    # TODO: Tweak for current project needs
    - containedctx
    - cyclop
    - depguard
    - dupword
    - err113
    - exhaustruct
    - gochecknoglobals
    - godot
    - intrange
    - ireturn
    - nlreturn
    - noctx
    - nonamedreturns
    - tagliatelle
    - testpackage
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5

    # Additional linters disabled to match previous behavior (v2 enables more by default)
    - embeddedstructfieldcheck
    - funcorder
    - godoclint
    - gosmopolitan
    - modernize
    - noinlineerr
    - prealloc
    - predeclared
    - rowserrcheck

    # TODO: Disabled, because they are failing at the moment, we should fix them and enable (step by step)
    - contextcheck
    - errcheck
    - errchkjson
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - funlen
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godox
    - gosec
    - ineffassign
    - lll
    - maintidx
    - mnd
    - nestif
    - nilnil
    - paralleltest
    - perfsprint
    - revive
    - staticcheck
    - tagalign
    - testifylint
    - thelper
    - unparam
    - usestdlibvars
    - usetesting

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    exhaustive:
      default-signifies-exhaustive: true
    funlen:
      lines: 120
      statements: 40
    gocognit:
      min-complexity: 25
    gocyclo:
      min-complexity: 20
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    lll:
      line-length: 120
      tab-width: 4
    misspell:
      locale: US
    mnd:
      checks:
        - argument
        - assign
        - case
        - condition
        - operation
        - return
    nakedret:
      max-func-lines: 5
    revive:
      enable-all-rules: true
      rules:
        - name: add-constant
          disabled: true
        - name: argument-limit
          arguments:
            - 7
          severity: warning
        - name: banned-characters
          disabled: true
        - name: cognitive-complexity
          disabled: true
        - name: comment-spacings
          arguments:
            - nolint
          severity: warning
        - name: cyclomatic
          disabled: true
        - name: file-header
          disabled: true
        - name: function-result-limit
          arguments:
            - 3
          severity: warning
        - name: function-length
          disabled: true
        - name: line-length-limit
          disabled: true
        - name: max-public-structs
          disabled: true
        - name: modifies-value-receiver
          disabled: true
        - name: package-comments
          disabled: true
        - name: unused-receiver
          disabled: true

  exclusions:
    generated: strict
    rules:
      - source: '^//go:generate '
        linters:
          - lll
      - path: _test\.go$
        linters:
          - funlen
          - maintidx
          - gocognit
          - gocyclo
      - path: 'pkg/tools/(i2c\.go|spi\.go)$'
        linters:
          - nolintlint

formatters:
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/RealityLink-Tech/MoonHub)
      custom-order: true
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/RealityLink-Tech/MoonHub

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
